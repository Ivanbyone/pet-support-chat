name: Test Workflows

on:
    workflow_call:
        inputs:
            group:
                required: true
                type: string

jobs:
    backend-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup JDK 21
              uses: actions/setup-java@v5 
              with:
                java-version: 21
                distribution: 'temurin'
                architecture: x64
            - name: ${{ inputs.group }} tests
              run: |
                cd chat-backend
                mvn clean test -Dgroups=${{ inputs.group }}
